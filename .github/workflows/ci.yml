name: CI

# P1-04: build + automated test execution only. No deployment automation, GitOps or
# multi-environment promotion in Phase 1 - that is Phase 2's "Cloud-Native Foundation".

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: urlshortener
          POSTGRES_PASSWORD: urlshortener
          POSTGRES_DB: urlshortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urlshortener"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      URLSHORTENER_DATABASE_URL: postgresql+asyncpg://urlshortener:urlshortener@localhost:5432/urlshortener
      URLSHORTENER_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: black --check
        run: black --check src tests

      - name: isort --check-only
        run: isort --check-only src tests

      - name: ruff check
        run: ruff check src tests

      - name: mypy
        run: mypy src tests

      - name: Apply database migrations
        run: alembic upgrade head

      - name: pytest (architecture, unit, integration)
        run: pytest

  build-images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service: [management_api, redirection_engine, click_consumer]

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -f "deploy/docker/Dockerfile.${{ matrix.service }}" \
            -t "urlshortener-${{ matrix.service }}:ci" \
            .

  e2e:
    name: End-to-end (docker compose round trip)
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: pytest -m e2e (full docker compose stack)
        run: pytest -m e2e tests/e2e
