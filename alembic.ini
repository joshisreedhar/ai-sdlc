# Alembic configuration - one linear migration history for the whole package.
#
# The database URL is deliberately left blank here: it is resolved at runtime from
# urlshortener.shared_kernel.config.Settings (env var URLSHORTENER_DATABASE_URL), so that
# containers, CI and developers all configure the database in exactly one way.
# Tests override it with `config.set_main_option("sqlalchemy.url", ...)`.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
