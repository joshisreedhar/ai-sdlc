[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "urlshortener"
version = "0.1.0"
description = "URL Shortener & Analytics Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# Phase 1 runtime dependencies only. Later phases add their own
# (celery, user-agents, geoip2, boto3, segno, prometheus-client, opentelemetry, ...).
# Architecture rule P-03 fails the build if a future-phase library is imported early.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "black>=24.8",
    "isort>=5.13",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/urlshortener"]

# --------------------------------------------------------------------------
# Formatting / linting - see markdowns/developer_notes.md section 1
#
# black owns code line length (88). ruff's E501 is set to 100 to match the
# existing .pylintrc and to leave room for prose in docstrings, which black
# does not reflow. ruff's isort rule ("I") is intentionally NOT enabled -
# isort runs as its own tool below and the two would disagree on width.
# --------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]
known_first_party = ["urlshortener"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]

[tool.ruff.lint.flake8-tidy-imports]
# Relative imports across packages hide layering violations from review.
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["urlshortener"]
warn_unreachable = true
no_implicit_reexport = true

# Tests are type-checked, but not held to the production contract: annotating every
# fixture and every parametrised test signature buys noise, not safety. Production code
# under src/ stays fully strict.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_return_any = false

# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# "." puts the repo root on sys.path so the architecture harness is importable
# as tests.architecture._arch; "src" makes the package importable without install.
pythonpath = ["src", "."]
asyncio_mode = "auto"
# e2e tests need a container runtime, build three images and bind the same host ports
# scripts/run_local.sh uses, so they are opt-in: `pytest -m e2e tests/e2e`.
addopts = "--strict-markers --strict-config -m \"not e2e\""
markers = [
    "architecture: structural/ArchUnit-equivalent rules (no application imports, no I/O)",
    "unit: fast isolated tests with no external dependencies",
    "integration: requires PostgreSQL and/or Redis",
    "e2e: full stack via docker/podman compose",
]

[tool.coverage.run]
source = ["src/urlshortener"]
branch = true
